# Docker-backed test suites for lci-codegraph, gated behind the `container-tests` Cargo feature
# (see the `[[test]]` entries with `required-features = ["container-tests"]` in Cargo.toml) so a
# plain `cargo test` — and CI.yml's `test` job — never needs a Docker daemon.
#
# Why a separate workflow: these three suites are slow (they pull and boot real containers) and
# exercise things a unit test can't fake convincingly:
#   - container_neo4j  — loads emitted nodes/edges into a real Neo4j and runs the retrieval
#                         queries a host would run against it.
#   - container_build  — builds and runs this crate inside Linux glibc and musl containers,
#                         proving the tree-sitter C grammars actually compile and link off the
#                         host toolchain (not just this runner's own toolchain).
#   - container_repos  — clones pinned real-world repositories and asserts the walk holds its
#                         invariants on input nobody here wrote.
# Bundling that cost into every PR would slow down the fast feedback loop CI.yml exists for, so
# it only runs on PRs that plausibly touch this surface (paths filter below), plus main, a
# nightly safety net, and on-demand via workflow_dispatch.
#
# Runner: `ubuntu-latest` (GitHub-hosted), which exposes a working host Docker daemon directly —
# NOT a self-hosted/ARC pod runner. Do not switch this to a self-hosted label: those runners have
# no Docker daemon, and this workflow must never fall back to docker-in-docker to get one.

name: Container tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/container-tests.yml"
  schedule:
    # Nightly safety net, independent of whether anyone touched tests/ or Cargo.toml that day —
    # catches drift from the outside world (e.g. an upstream real-world repo used by
    # container_repos changing shape, or a base image update).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-tests:
    name: container tests
    runs-on: ubuntu-latest
    # Generous ceiling: pulling/building glibc + musl Rust images, booting Neo4j, and cloning
    # several real-world repositories over the network can legitimately take a while, especially
    # on a cold cache. This bounds a genuinely hung container/network call, not normal runtime.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # branch: stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: "."

      - name: cargo test --features container-tests
        # `--no-fail-fast` is load-bearing here, not belt-and-braces. Each suite is a separate test
        # binary, and by default cargo stops at the first binary that fails — so a broken
        # container_build meant container_neo4j and container_repos never ran at all, and a single
        # red job told us nothing about the other two. These suites are slow and independent; when
        # one breaks we want the full picture from that run, not a bisect across pushes.
        run: cargo test --workspace --locked --features container-tests --no-fail-fast
